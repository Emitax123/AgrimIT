[pytest]
DJANGO_SETTINGS_MODULE = agrimIT.settings.dev
# manage.py vive en agrimIT/; ese dir debe estar en el path para importar
# `agrimIT.settings` y `apps.*` (conftest.py tambien lo inserta, por las dudas).
pythonpath = agrimIT
python_files = tests.py test_*.py *_tests.py
testpaths = tests agrimIT/apps
addopts = -p no:cacheprovider
