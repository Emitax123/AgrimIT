{% load static %}
<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ingresar · AgrimIT</title>
    <link rel="icon" type="image/svg+xml" href="{% static 'img/favicon.svg' %}" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" type="text/css" href="{% static 'css/design-system.css' %}" />
  </head>
  <body class="ds login-body">
    <div class="login-wrap">
      <div class="login-card">
        <img class="logo" src="{% static 'img/logo.png' %}" alt="AgrimIT" />
        <form method="POST">
          {% csrf_token %}
          {% if error %}
            <div class="err-banner">Usuario o contraseña incorrectos</div>
          {% endif %}
          <div class="ffield">
            <label class="fl" for="username">Usuario</label>
            <input class="std" placeholder="Nombre de usuario" type="text" name="username" id="username" autocomplete="username" required />
          </div>
          <div class="ffield">
            <label class="fl" for="password">Contraseña</label>
            <input class="std" placeholder="Contraseña" type="password" name="password" id="password" autocomplete="current-password" required />
          </div>
          <button type="submit" class="btn btn-primary login-submit">Ingresar</button>
        </form>
      </div>
    </div>
  </body>
</html>
