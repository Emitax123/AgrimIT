{% extends 'base/base_template.html' %}
{% load static %}
{% load widget_tweaks %}

{% block topbar %}
  <div>
    <h1>Nuevo cliente</h1>
    <div class="sub">Cargá los datos del cliente</div>
  </div>
{% endblock %}

{% block content %}
  {% if error %}<div class="panel" style="max-width:560px;margin-bottom:14px"><div class="body" style="color:var(--red)">{{ error }}</div></div>{% endif %}
  <div class="panel" style="max-width:560px">
    <form autocomplete="off" method="POST" action="{% url 'clientcreate' %}">
      {% csrf_token %}
      <div class="body" style="display:flex;flex-direction:column;gap:16px">
        <div class="fgrid">
          <div><label class="fl">Nombre y apellido *</label><input class="std" type="text" name="name" required></div>
          <div><label class="fl">Teléfono</label><input class="std" type="tel" name="phone"></div>
        </div>
        <div class="fgrid">
          <div><label class="fl">Email</label><input class="std" type="email" name="email"></div>
          <div><label class="fl">Tipo de identificación</label>{{ form.id_type|add_class:'std' }}</div>
          <div><label class="fl">Número de ID</label><input class="std" type="text" name="id_number"></div>
        </div>
        <div style="display:flex;gap:10px;justify-content:flex-end">
          <a href="{% url 'clients' %}" class="btn btn-ghost">Cancelar</a>
          <button type="submit" class="btn btn-primary">Crear cliente</button>
        </div>
      </div>
    </form>
  </div>
{% endblock %}
